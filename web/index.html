<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UZEX bitimlar bo'yicha AI-yordamchi / AI-ассистент по сделкам UZEX</title>
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --text: #1d2330; --muted: #6b7384; --line: #e1e5ec;
    --accent: #0b63c7; --accent-soft: #e6f0fb; --user: #dfe9f7; --bot: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh;
  }
  header {
    background: var(--card); border-bottom: 1px solid var(--line); padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; position: sticky; top: 0; z-index: 2;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; line-height: 1.3; }
  header .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .lang { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; flex-shrink: 0; }
  .lang button {
    border: 0; background: transparent; padding: 6px 12px; cursor: pointer; font-size: 13px; color: var(--muted);
  }
  .lang button.active { background: var(--accent); color: #fff; }
  main { flex: 1; width: 100%; max-width: 820px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .intro { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .intro p { margin: 0 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--accent); color: var(--accent); background: var(--accent-soft); border-radius: 999px;
    padding: 6px 12px; cursor: pointer; font-size: 13.5px; font-family: inherit;
  }
  .chip:hover { background: var(--accent); color: #fff; }
  #chat { display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 92%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bot); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.bot.error { border-color: #e8b4b4; background: #fff5f5; }
  .msg.bot.pending { color: var(--muted); font-style: italic; }
  .basis { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 13px; color: var(--muted); white-space: normal; }
  .basis div { margin: 2px 0; }
  .basis details { margin-top: 4px; }
  .basis summary { cursor: pointer; color: var(--accent); }
  .basis pre {
    margin: 6px 0 0; padding: 8px 10px; background: #f6f8fa; border: 1px solid var(--line); border-radius: 8px;
    font: 12.5px/1.45 Consolas, "Courier New", monospace; white-space: pre-wrap; word-break: break-word; color: var(--text);
  }
  .table-wrap { overflow-x: auto; margin-top: 6px; }
  table { border-collapse: collapse; font-size: 12.5px; }
  th, td { border: 1px solid var(--line); padding: 3px 8px; text-align: left; white-space: nowrap; }
  th { background: #f6f8fa; }
  form {
    position: sticky; bottom: 0; background: var(--bg); padding: 10px 0 14px; display: flex; gap: 8px; align-items: flex-end;
  }
  textarea {
    flex: 1; resize: none; min-height: 46px; max-height: 160px; padding: 11px 14px; border: 1px solid var(--line);
    border-radius: 12px; font: inherit; background: var(--card); color: var(--text);
  }
  textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  #send {
    border: 0; background: var(--accent); color: #fff; border-radius: 12px; padding: 0 18px; height: 46px;
    font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  #send:disabled { opacity: .55; cursor: default; }
  .counter { font-size: 11.5px; color: var(--muted); text-align: right; margin-top: -8px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 6px 16px 12px; }
  @media (max-width: 560px) {
    header h1 { font-size: 15px; }
    .msg { max-width: 100%; }
    main { padding: 12px; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1 data-i18n="title"></h1>
    <div class="sub" data-i18n="subtitle"></div>
  </div>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="uz">UZ</button>
    <button type="button" data-lang="ru">RU</button>
  </div>
</header>

<main>
  <section class="intro">
    <p data-i18n="intro"></p>
    <div class="chips" id="chips"></div>
  </section>

  <div id="chat" aria-live="polite"></div>

  <form id="form" autocomplete="off">
    <textarea id="q" rows="1" maxlength="500" data-i18n-placeholder="placeholder"></textarea>
    <button type="submit" id="send" data-i18n="ask"></button>
  </form>
  <div class="counter"><span id="count">0</span>/500</div>
</main>
<footer data-i18n="footer"></footer>

<script>
(function () {
  "use strict";

  var EXAMPLES = [
    "2024-yilda qancha paxta sotilgan?",
    "Кто покупатель по сделке 100001?",
    "2025-yil top-5 broker",
    "Цена цемента в марте 2023",
    "15.06.2024 dollar kursi",
    "Сделки компании Qojo Invest"
  ];

  var T = {
    uz: {
      title: "UZEX bitimlar bo'yicha AI-yordamchi",
      subtitle: "Ma'lumotlar: 03.01.2022 – 30.10.2026, 500 000 bitim. Savolni o'zbek yoki rus tilida yozing.",
      intro: "Misol savollardan birini tanlang yoki o'zingiz yozing. Har javob ostida: ✅ qatorlar soni va vaqt, 🔎 savol qanday tushunilgani, ▸ SQL so'rov.",
      placeholder: "Savol / Вопрос…",
      ask: "So'rash",
      waiting: "⏳ Ma'lumotlarni qidiryapman… / Ищу в данных… (5–30 s)",
      error: "⚠️ Texnik xatolik yuz berdi, iltimos qayta urinib ko'ring.",
      busy: "Oldingi savolga javob kutilmoqda.",
      rows_label: "Natija qatorlari",
      footer: "Javoblar faqat berilgan ma'lumotlar bazasidan hisoblanadi; model natija qatorlarini ko'rmaydi."
    },
    ru: {
      title: "AI-ассистент по сделкам UZEX",
      subtitle: "Данные: 03.01.2022 – 30.10.2026, 500 000 сделок. Пишите вопрос на русском или узбекском.",
      intro: "Выберите пример или напишите свой вопрос. Под каждым ответом: ✅ число строк и время, 🔎 как понят вопрос, ▸ SQL-запрос.",
      placeholder: "Вопрос / Savol…",
      ask: "Спросить",
      waiting: "⏳ Ищу в данных… / Ma'lumotlarni qidiryapman… (5–30 s)",
      error: "⚠️ Произошла техническая ошибка, попробуйте ещё раз.",
      busy: "Дождитесь ответа на предыдущий вопрос.",
      rows_label: "Строки результата",
      footer: "Ответы считаются только по предоставленной базе; модель не видит строки результата."
    }
  };

  var lang = localStorage.getItem("uzex_lang") || "uz";
  var chat = document.getElementById("chat");
  var form = document.getElementById("form");
  var input = document.getElementById("q");
  var send = document.getElementById("send");
  var count = document.getElementById("count");
  var busy = false;

  function sessionId() {
    var id = sessionStorage.getItem("uzex_session");
    if (!id) {
      id = Math.random().toString(36).slice(2) + Date.now().toString(36);
      sessionStorage.setItem("uzex_session", id);
    }
    return id;
  }

  function applyLang(next) {
    lang = T[next] ? next : "uz";
    localStorage.setItem("uzex_lang", lang);
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = T[lang][el.dataset.i18n]; });
    document.querySelectorAll("[data-i18n-placeholder]").forEach(function (el) {
      el.placeholder = T[lang][el.dataset.i18nPlaceholder];
    });
    document.querySelectorAll("[data-lang]").forEach(function (b) {
      b.classList.toggle("active", b.dataset.lang === lang);
    });
  }

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function addMessage(cls, text) {
    var node = el("div", "msg " + cls, text);
    chat.appendChild(node);
    node.scrollIntoView({ behavior: "smooth", block: "end" });
    return node;
  }

  function basisBlock(data) {
    var L = data.labels || {};
    var basis = el("div", "basis");
    var status;
    if (!data.answerable) {
      status = "ℹ️ " + (L.no_data || "") + " · " + data.elapsed_sec + " s";
    } else if (data.row_count === 0) {
      status = "🔍 " + (L.no_data || "") + " · " + data.elapsed_sec + " s";
    } else {
      status = "✅ " + (L.verified || "") + " · " + data.row_count + " " + (L.rows || "") + " · " + data.elapsed_sec + " s";
    }
    basis.appendChild(el("div", "", status));
    if (data.interpretation) {
      var interp = el("div");
      interp.innerHTML = "🔎 " + (L.interp || "") + ": " + data.interpretation; // server-escaped
      basis.appendChild(interp);
    }
    if (data.sql) {
      var details = el("details");
      details.appendChild(el("summary", "", "▸ " + (L.sql || "SQL")));
      details.appendChild(el("pre", "", data.sql));
      if (data.rows && data.rows.length) details.appendChild(rowsTable(data));
      basis.appendChild(details);
    }
    return basis;
  }

  function rowsTable(data) {
    var wrap = el("div", "table-wrap");
    wrap.appendChild(el("div", "", T[lang].rows_label + " (" + data.rows.length + "):"));
    var table = el("table"), head = el("tr");
    (data.columns || []).forEach(function (c) { head.appendChild(el("th", "", c)); });
    table.appendChild(head);
    data.rows.slice(0, 50).forEach(function (r) {
      var tr = el("tr");
      r.forEach(function (v) { tr.appendChild(el("td", "", v === null ? "" : String(v))); });
      table.appendChild(tr);
    });
    wrap.appendChild(table);
    return wrap;
  }

  function renderAnswer(node, data) {
    node.classList.remove("pending");
    node.innerHTML = data.answer_html; // server-escaped, only <b> tags inside
    node.appendChild(basisBlock(data));
    node.scrollIntoView({ behavior: "smooth", block: "end" });
  }

  function setBusy(state) {
    busy = state;
    send.disabled = state;
    input.disabled = state;
  }

  function ask(question) {
    question = (question || "").trim();
    if (!question || busy) return;
    if (question.length > 500) question = question.slice(0, 500);
    addMessage("user", question);
    input.value = "";
    count.textContent = "0";
    autosize();
    var pending = addMessage("bot pending", T[lang].waiting);
    setBusy(true);
    fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: question, session: sessionId() })
    })
      .then(function (res) {
        return res.json().then(function (body) { return { ok: res.ok, status: res.status, body: body }; });
      })
      .then(function (r) {
        if (!r.ok) {
          var detail = r.body && r.body.detail;
          pending.classList.remove("pending");
          pending.classList.add("error");
          pending.textContent = r.status === 429 ? T[lang].busy : (typeof detail === "string" ? detail : T[lang].error);
          return;
        }
        renderAnswer(pending, r.body);
      })
      .catch(function () {
        pending.classList.remove("pending");
        pending.classList.add("error");
        pending.textContent = T[lang].error;
      })
      .then(function () { setBusy(false); input.focus(); });
  }

  function autosize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  }

  var chips = document.getElementById("chips");
  EXAMPLES.forEach(function (q) {
    var b = el("button", "chip", q);
    b.type = "button";
    b.addEventListener("click", function () { ask(q); });
    chips.appendChild(b);
  });

  document.querySelectorAll("[data-lang]").forEach(function (b) {
    b.addEventListener("click", function () { applyLang(b.dataset.lang); });
  });

  form.addEventListener("submit", function (e) { e.preventDefault(); ask(input.value); });
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(input.value); }
  });
  input.addEventListener("input", function () { count.textContent = String(input.value.length); autosize(); });

  applyLang(lang);
  autosize();
  input.focus();
})();
</script>
</body>
</html>
